name: Update Baileys

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Published Baileys version, or latest
        default: latest
        type: string

permissions:
  contents: read

concurrency:
  group: baileys-update
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare SDK update
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.update.outputs.changed }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Apply source patches and validate the SDK candidate
        id: update
        env:
          SDK_VERSION: ${{ inputs.version || 'latest' }}
        run: pnpm sdk:update "$SDK_VERSION"

      - name: Upload the proposed dependency changes
        if: steps.update.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: baileys-update
          path: .tmp/baileys-update/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  pull-request:
    name: Open SDK update PR
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Download dependency data from the preparation job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: baileys-update
          path: .tmp/baileys-update

      - name: Open or update the PR and explicitly dispatch required CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/baileys.ts publish .tmp/baileys-update
